<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlixEat – Big flavours, delivered with a grin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff3d6;--card:#fff;--ink:#2a1a2e;--mute:#7b6a7d;--chili:#d62839;--saffron:#ffb000;--leaf:#1f8a5b;--line:#f0dcae}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1420;--card:#2c1e30;--ink:#fbefd9;--mute:#b9a5bb;--line:#463049}}
:root[data-theme="dark"]{--bg:#1e1420;--card:#2c1e30;--ink:#fbefd9;--mute:#b9a5bb;--line:#463049}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Baloo 2',Nunito,system-ui,sans-serif;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--saffron);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:1.7rem;font-weight:800;background:none;border:0;padding:0}
.brand b{color:var(--chili)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;align-items:center}
nav button{background:none;border:0;padding:8px 12px;border-radius:99px;font-weight:800}
nav button:hover,nav button.on{background:var(--saffron);color:#2a1a2e}
.pill{background:var(--chili);color:#fff;border-radius:99px;padding:0 7px;font-size:.8rem;margin-left:4px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;background:radial-gradient(circle at 88% 12%,#ff7a2f 0,transparent 42%),radial-gradient(circle at 5% 100%,#8f1424 0,transparent 45%),var(--chili);color:#fff;border-radius:28px;padding:36px 32px;overflow:visible}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}
.hero p{font-size:1.1rem;margin:12px 0 18px;max-width:34ch}
.stage{position:relative;justify-self:center;width:100%;max-width:280px}.stage>svg{width:100%;transform:rotate(-4deg)}
.btn{background:var(--saffron);color:#2a1a2e;border:0;border-radius:14px;padding:11px 20px;font-weight:800}
.btn.alt{
    background:#2c1e30;
    color:#ffffff !important;
    border:2px solid #ffffff;
}
.btn.sm{padding:6px 12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h2{font-size:1.7rem;margin:32px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;text-align:left}
.card.click{cursor:pointer;transition:transform .15s}
.card.click:hover{transform:translateY(-3px);border-color:var(--saffron)}
.pic{height:130px;display:grid;place-items:center;overflow:hidden}.art{width:100%;height:100%;display:block}
.body{padding:12px 14px 14px}
.body h3{font-size:1.2rem}
.mute{color:var(--mute);font-size:.9rem}
.tag{display:inline-block;background:var(--bg);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:800;margin:6px 4px 0 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.bar input{flex:1;min-width:200px;width:auto}.bar select{width:auto}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:800}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.auth{max-width:420px;margin:20px auto;display:grid;gap:10px}
.auth h1{color:var(--ink)}
.auth label{color:var(--ink)}
.auth input{color:var(--ink);background:var(--card)}
.auth input::placeholder{color:var(--mute)}
.auth label{font-weight:800;font-size:.9rem}
.err{color:var(--chili);font-weight:800}
.cartrow{display:grid;grid-template-columns:48px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:none;font-weight:800}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font:800 1.4rem 'Baloo 2',sans-serif;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.track{display:flex;gap:6px;margin:12px 0}
.track div{flex:1;text-align:center;font-size:.78rem;font-weight:800;padding:6px 2px;border-radius:10px;background:var(--bg);color:var(--mute)}
.track div.done{background:var(--leaf);color:#fff}
.modal{position:fixed;inset:0;background:rgba(20,10,25,.6);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:420px;width:100%}
.modal .pic{height:170px;font-size:5.5rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:10}
.hs{display:flex;gap:8px;background:#fff;border-radius:16px;padding:6px;max-width:460px}.hs input{border:0;color:#2a1a2e;background:transparent}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.hero .chip{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}.hero .chip:hover{background:#fff;color:var(--chili)}
.fl{position:absolute;width:30%;aspect-ratio:1;background:#fff;border-radius:50%;border:3px solid var(--saffron);overflow:hidden;animation:bob 4s ease-in-out infinite}.f1{top:-6%;left:-14%}.f2{top:2%;right:-16%;animation-delay:-1.3s}.f3{bottom:-2%;right:-8%;animation-delay:-2.6s}@keyframes bob{50%{transform:translateY(-8px)}}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:16px 4px 0;font-weight:800}.stats b{font:800 1.6rem 'Baloo 2',sans-serif;color:var(--chili)}
@media(max-width:700px){.hero,.cols{grid-template-columns:1fr}.stage{max-width:190px}.cartrow{grid-template-columns:40px 1fr auto}.cartrow>b{grid-column:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

main{padding-bottom:90px}
.rail{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}.rail>*{flex:none;scroll-snap-align:start}
.tile{background:none;border:0;width:104px;text-align:center;font-weight:800;font-size:.9rem;padding:0}
.tile span{display:block;width:96px;height:96px;border-radius:50%;margin:0 auto 6px;overflow:hidden}.tile span svg{width:100%;height:100%}
.rc{width:250px;cursor:pointer;text-align:left}.rc h3{font-size:1.15rem}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 16px}.rgrid .rc{width:auto}
.rimg{position:relative;height:160px;border-radius:20px;overflow:hidden;margin-bottom:8px}.rimg>svg{width:100%;height:100%}
.off{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;color:#fff;font:800 1.05rem 'Baloo 2',sans-serif;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.rm{font-weight:800;display:flex;gap:6px;align-items:center}
.rate{background:var(--leaf);color:#fff;border-radius:99px;padding:0 8px;font-size:.85rem}
.rh{padding:14px 0;border-bottom:2px dashed var(--line)}.offs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.off2{border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.85rem;background:var(--card)}
.mr{display:flex;justify-content:space-between;gap:16px;padding:20px 0 26px;border-bottom:1px solid var(--line)}.mr.out{opacity:.5}
.mi{flex:1;min-width:0}.mi h3{font-size:1.15rem;margin:4px 0}.mi p{margin:6px 0 0}
.mp{position:relative;width:132px;flex:none;text-align:center}
.mimg{height:110px;border-radius:16px;overflow:hidden}.mimg svg{width:100%;height:100%}
.addb,.stp{position:absolute;left:50%;transform:translateX(-50%);bottom:-16px;width:96px;height:36px;background:var(--card);border:2px solid var(--line);border-radius:10px;color:var(--leaf);font-weight:800;display:flex;align-items:center;justify-content:space-around;padding:0}
.stp button{background:none;border:0;font-weight:800;font-size:1.2rem;color:var(--leaf);width:30px}.so{position:absolute;left:50%;transform:translateX(-50%);bottom:-12px}
.dot{display:inline-block;width:16px;height:16px;border:2px solid;border-radius:3px;position:relative;vertical-align:-2px}.dot:after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.v{color:var(--leaf)}.dot.nv{color:var(--chili)}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--leaf);color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;font-weight:800;border:0;width:100%}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chiprow .chip{flex:none}
</style>
</head>

function oRow(o){const s=stage(o);return `<div class="panel" style="margin-bottom:12px"><div class="row"><b>Order #${o.id}</b><span class="tag">${STAGES[s]}</span><b>${inr(o.total)}</b></div><div class="track">${STAGES.map((t,i)=>`<div class="${i<=s?'done':''}">${t}</div>`).join('')}</div><button class="btn sm alt" data-act="det" data-id="${o.id}">${S.det[o.id]?'Hide':'View'} details</button>${S.det[o.id]?`<div style="margin-top:10px">${o.items.map(i=>`<div class="tot"><span>${i.q} × ${i.n}</span><span>${inr(i.p*i.q)}</span></div>`).join('')}<div class="mute">📍 ${esc(o.addr)} · 📞 ${esc(o.phone)} · ${new Date(o.ts).toLocaleString()}</div></div>`:''}</div>`}
function resR(){const q=S.q.toLowerCase(),F=S.flt;let l=R.filter(r=>(S.cat=='All'||r.cui==S.cat)&&(r.n+' '+r.cui).toLowerCase().includes(q)&&(!F.fast||em(r)<=25)&&(!F.r45||r.rt>=4.5)&&(!F.veg||pureVeg(r))&&(!F.u300||avg(r)<300));if(S.sort=='rt')l.sort((a,b)=>b.rt-a.rt);if(S.sort=='eta')l.sort((a,b)=>em(a)-em(b));return l.length?l.map(rcard).join(''):'<p class="mute">No restaurants match. Try removing a filter.</p>'}
function resD(){const q=S.q.toLowerCase(),l=D.filter(f=>(S.type=='All'||f.t==S.type)&&(S.price=='All'||(S.price=='u'?f.p<150:S.price=='m'?f.p>=150&&f.p<=300:f.p>300))&&(f.n+f.d+rr(f.r).n).toLowerCase().includes(q));return l.length?l.map(f=>fcard(f)).join(''):'<p class="mute">No dishes match. Try a different search or price.</p>'}

/* ---------- App logic ---------- */
function render(){nav();$('#app').innerHTML=(V[S.v]||V.home)()}
function go(v,keep){S.v=v;if(!keep)S.msg='';if(v!='restaurants'&&v!='dishes'){}render();scrollTo(0,0)}
const save=()=>{st.set('cart',S.cart);nav()};
function need(){if(S.user)return true;S.msg='Please log in to continue.';go('login',1);return false}
function dish(id){const f=dd(id),r=rr(f.r);$('#modal').innerHTML=`<div class="modal" data-act="close"><div class="card" role="dialog" aria-label="${f.n}"><div class="pic" style="background:${hue(f.id)}">${art(f)}</div><div class="body"><h2 style="margin:0">${f.n}</h2><div class="mute">from <a href="#" data-act="rest" data-id="${r.id}" style="color:var(--chili);font-weight:800">${r.n}</a> · ${TL[f.t]}</div><p>${f.d}</p><div class="row"><b style="font-size:1.4rem">${inr(f.p)}</b>${f.a?`<button class="btn" data-act="add" data-id="${f.id}">Add to cart</button>`:'<span class="tag">Currently unavailable</span>'}</div></div></div></div>`}
async function act(a,d,ev){switch(a){
case'go':S.q='';S.flt={};S.sort='rel';S.cat='All';S.type='All';S.price='All';go(d.v);break;case'hsearch':S.q=($('#hq').value||'').trim();S.type='All';S.price='All';go('dishes');break;case'qs':S.q=d.q;S.type='All';S.price='All';go('dishes');break;case'cui':S.q='';S.flt={};S.cat=d.c;go('restaurants');break;case'flt':S.flt[d.k]=!S.flt[d.k];render();break;case'vo':S.vo=!S.vo;render();break;
case'rest':ev.preventDefault();S.rid=+d.id;$('#modal').innerHTML='';go('rest');break;
case'dish':dish(+d.id);break;
case'close':if(ev.target.dataset.act=='close')$('#modal').innerHTML='';break;
case'add':S.cart[d.id]=(S.cart[d.id]||0)+1;save();toast('Added '+dd(d.id).n);if(S.v=='cart'||S.v=='rest')render();break;
case'inc':S.cart[d.id]++;save();render();break;
case'dec':if(--S.cart[d.id]<1)delete S.cart[d.id];save();render();break;
case'rm':delete S.cart[d.id];save();render();break;
case'cat':S.cat=d.c;render();break;
case'type':S.type=d.t;render();break;
case'det':S.det[d.id]=!S.det[d.id];render();break;
case'checkout':if(need())go('checkout');break;
case'logout':{
 try{await fetch('/api/logout',{method:'POST'});}catch(e){}
 S.user=null;
 st.set('session',null);
 toast('Logged out');
 go('home');
 break;
}
case'reg':{
 const n=$('#nm').value.trim(),
       e=$('#em').value.trim().toLowerCase(),
       p=$('#ph').value.replace(/\D/g,''),
       w=$('#pw').value;

 S.msg=!n?'Enter your name.':
       !/^\S+@\S+\.\S+$/.test(e)?'Enter a valid email.':
       p.length<10?'Enter a 10-digit phone number.':
       w.length<6?'Password needs 6+ characters.':'';

 if(S.msg){render();break}

 try{
   const response=await fetch('/api/register',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({name:n,email:e,phone:p,password:w})
   });

   const data=await response.json();

   if(!response.ok || !data.success){
     S.msg=data.message||'Registration failed.';
     render();
     break;
   }

   S.msg='Registration successful. Please log in.';
   go('login',1);
 }catch(error){
   console.error(error);
   S.msg='Cannot connect to Flask server.';
   render();
 }
 break;
}
case'login':{
 const e=$('#em').value.trim().toLowerCase(),
       w=$('#pw').value;

 if(!e||!w){
   S.msg='Enter your email and password.';
   render();
   break;
 }

 try{
   const response=await fetch('/api/login',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({email:e,password:w})
   });

   const data=await response.json();

   if(!response.ok || !data.success){
     S.msg=data.message||'Email or password is incorrect.';
     render();
     break;
   }

   S.user=data.user;
   st.set('session',S.user);
   S.msg='';
   toast('Welcome back, '+S.user.name.split(' ')[0]+'!');
   go(count()?'cart':'home');
 }catch(error){
   console.error(error);
   S.msg='Cannot connect to Flask server.';
   render();
 }
 break;
}
case'place':{const ad=$('#addr').value.trim(),ph=$('#ph').value.replace(/\D/g,'');
 if(ad.length<10||ph.length<10){S.msg=ad.length<10?'Enter your full delivery address.':'Enter a 10-digit phone number.';render();break}
 const o={id:Math.floor(Math.random()*9e5+1e5),uid:S.user.id,ts:Date.now(),addr:ad,phone:ph,total:sub()+FEE,items:cartItems().map(x=>({n:x.f.n,p:x.f.p,q:x.q}))};
 st.set('orders',[...st.get('orders',[]),o]);S.cart={};save();toast('Order placed!');go('orders');break}
}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset,e)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('[role=button]'))e.target.click();if(e.key=='Enter'&&e.target.id=='hq')act('hsearch',{},e);if(e.key=='Escape')$('#modal').innerHTML=''});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#res').innerHTML=S.v=='dishes'?resD():resR()}});
document.addEventListener('change',e=>{const k=e.target.dataset.sel;if(k){S[k]=e.target.value;render()}});
setInterval(()=>{if(S.v=='orders'||S.v=='home')render()},STEP/5);

async function loadBackendData(){
  try{
    const [restaurantResponse, foodResponse] = await Promise.all([
      fetch('/api/restaurants'),
      fetch('/api/food')
    ]);

    if(!restaurantResponse.ok || !foodResponse.ok){
      throw new Error('Backend API request failed');
    }

    const restaurantData = await restaurantResponse.json();
    const foodData = await foodResponse.json();

    const restaurants = restaurantData.restaurants || restaurantData.data || [];
    const foods = foodData.food || foodData.food_items || foodData.data || [];

    if(Array.isArray(restaurants) && restaurants.length){
      R = restaurants.map(r => ({
        id: Number(r.id),
        n: r.name ?? r.n ?? '',
        cui: r.category ?? r.cui ?? 'Other',
        e: r.emoji ?? r.e ?? '🍽️',
        rt: Number(r.rating ?? r.rt ?? 0),
        eta: String(r.eta_minutes ?? r.eta ?? '30-40'),
        about: r.description ?? r.about ?? ''
      }));
    }

    if(Array.isArray(foods) && foods.length){
      D = foods.map(f => ({
        id: Number(f.id),
        r: Number(f.restaurant_id ?? f.r),
        n: f.name ?? f.n ?? '',
        d: f.description ?? f.d ?? '',
        p: Number(f.price ?? f.p ?? 0),
        e: f.emoji ?? f.e ?? '🍽️',
        t: f.category ?? f.t ?? 'other',
        a: Number(f.available ?? f.a ?? 0),
        pop: Number(f.popular ?? f.pop ?? 0)
      }));
    }

    console.log('AlixEats: restaurant data loaded from MySQL', R.length);
    console.log('AlixEats: food data loaded from MySQL', D.length);

    render();
  }catch(error){
    console.error('Could not load restaurant/food data from Flask:', error);
    console.warn('Using the existing frontend data as fallback.');
    render();
  }
}

async function restoreSession(){
 try{
   const response=await fetch('/api/me');
   const data=await response.json();

   if(data.logged_in && data.user){
     S.user=data.user;
     st.set('session',S.user);
   }else{
     S.user=null;
     st.set('session',null);
   }
 }catch(error){
   console.warn('Could not restore Flask session:',error);
 }

 render();
}

loadBackendData();
restoreSession();
</script>
